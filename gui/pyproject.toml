[project]
name = "bondtest72-gui"
version = "0.1.0"
description = "Desktop app for the BondTest72 wirebond tester"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pyqtgraph>=0.13.7",
    "pyserial>=3.5",
    "pyside6-essentials>=6.7",
]

[project.scripts]
bondtest72-gui = "bondtest72_gui.app:main"
gui = "bondtest72_gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bondtest72_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
