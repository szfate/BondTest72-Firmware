[project]
name = "bondtest72-gui"
version = "0.1.0"
description = "Desktop app for the BondTest72 wirebond tester"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Exact pins: an upgrade is a deliberate edit here, not whatever is newest at
# install time. The indirect dependencies are pinned too, so a plain pip
# install gets the same set as uv.lock (which also records their hashes).
dependencies = [
    "pyqtdarktheme-fork==2.3.6",
    "pyqtgraph==0.14.0",
    "pyserial==3.5",
    "pyside6-essentials==6.12.0",
    # Indirect: through pyqtdarktheme-fork, pyqtgraph and pyside6-essentials.
    "darkdetect==0.8.0",
    "colorama==0.4.6",
    "numpy==2.4.6; python_version < '3.12'",     # numpy 2.5 needs Python 3.12+
    "numpy==2.5.4; python_version >= '3.12'",
    "shiboken6==6.12.0",
]

[project.scripts]
bondtest72-gui = "bondtest72_gui.app:main"
gui = "bondtest72_gui.app:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bondtest72_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
